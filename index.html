<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinInsight – Market Intelligence</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              theme: {
                bg: 'var(--bg-primary)',
                surface: 'var(--bg-secondary)',
                text: 'var(--text-primary)',
                muted: 'var(--text-secondary)',
                accent: 'var(--accent)',
                border: 'var(--border-color)'
              },
              slate: {
                850: '#151e2e',
                900: '#0f172a',
                950: '#020617',
              },
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
              'hero-glow': 'conic-gradient(from 180deg at 50% 50%, #2a8af6 0deg, #a853ba 180deg, #e92a67 360deg)',
            },
            keyframes: {
              shimmer: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-15px)' },
              },
              'pulse-glow': {
                '0%, 100%': { opacity: '1', boxShadow: '0 0 20px rgba(59, 130, 246, 0.4)' },
                '50%': { opacity: '0.8', boxShadow: '0 0 40px rgba(59, 130, 246, 0.6)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              blob: {
                "0%": { transform: "translate(0px, 0px) scale(1)" },
                "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                "100%": { transform: "translate(0px, 0px) scale(1)" }
              },
              typewriter: {
                '0%': { width: '0%' },
                '100%': { width: '100%' }
              },
              grid: {
                '0%': { transform: 'translateY(0)' },
                '100%': { transform: 'translateY(40px)' }
              }
            },
            animation: {
              shimmer: 'shimmer 1.5s infinite',
              'fade-in': 'fadeIn 0.6s ease-out forwards',
              float: 'float 6s ease-in-out infinite',
              'pulse-glow': 'pulse-glow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              marquee: 'marquee 40s linear infinite',
              blob: "blob 7s infinite",
              typewriter: "typewriter 2s steps(40) 1s 1 normal both",
              'grid-move': 'grid 3s linear infinite'
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      
      /* THEME VARIABLES */
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --accent: #3b82f6;
        --border-color: #e2e8f0;
      }

      .theme-dark {
        --bg-primary: #0f172a; /* Slate 900 */
        --bg-secondary: #1e293b; /* Slate 800 */
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent: #3b82f6;
        --border-color: #334155;
      }

      .theme-midnight {
        --bg-primary: #000000;
        --bg-secondary: #09090b; /* Zinc 950 */
        --text-primary: #ffffff;
        --text-secondary: #a1a1aa;
        --accent: #8b5cf6; /* Violet */
        --border-color: #27272a;
      }

      .theme-terminal {
        --bg-primary: #050505;
        --bg-secondary: #111111;
        --text-primary: #4ade80; /* Green 400 */
        --text-secondary: #22c55e;
        --accent: #22c55e;
        --border-color: #14532d;
      }

      .theme-ocean {
        --bg-primary: #020617; /* Slate 950 */
        --bg-secondary: #0f172a;
        --text-primary: #e0f2fe; /* Sky 100 */
        --text-secondary: #7dd3fc; /* Sky 300 */
        --accent: #06b6d4; /* Cyan */
        --border-color: #1e293b;
      }

      /* Technical Grid Background */
      .bg-grid-pattern {
        background-image: linear-gradient(to right, rgba(128, 128, 128, 0.05) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(128, 128, 128, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      
      .theme-dark .bg-grid-pattern,
      .theme-midnight .bg-grid-pattern,
      .theme-terminal .bg-grid-pattern,
      .theme-ocean .bg-grid-pattern {
        background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      }

      /* Custom scrollbar */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Modern Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      .theme-dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
      .theme-dark ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .theme-dark .glass-panel, .theme-midnight .glass-panel {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .text-gradient {
        background: linear-gradient(to right, #60a5fa, #a78bfa, #f472b6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .typing-cursor::after {
        content: '|';
        animation: cursor 1s infinite;
      }
      
      @keyframes cursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "remark-gfm": "https://aistudiocdn.com/remark-gfm@^4.0.0",
    "recharts": "https://aistudiocdn.com/recharts@^2.12.0"
  }
}
</script>
</head>
  <body class="bg-theme-bg text-theme-text transition-colors duration-300 overflow-x-hidden antialiased">
    <div id="root"></div>
  </body>
</html>
